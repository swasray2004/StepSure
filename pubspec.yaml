name: gait_rehab
description: AI-Based Gait Analysis for Stroke Rehabilitation

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.3.0
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  video_player: ^2.8.3
  google_mlkit_pose_detection: ^0.10.0
  flutter_tts: ^3.8.5
  fl_chart: ^0.67.0
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2
  pdf: ^3.10.8
  printing: ^5.12.0
  provider: ^6.1.2
  uuid: ^4.3.3
  intl: ^0.19.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.1
  lottie: ^3.1.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/images/